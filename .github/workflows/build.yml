name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Switch to required Gradle version (Gradle 8.11.1)
      run: |
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip" > gradle/wrapper/gradle-wrapper.properties

    - name: Automatically Patch Project Structure and Resources
      run: |
        python3 - << 'EOF'
        import glob
        import re

        # 1. Clean Manifests (remove obsolete package attributes safely)
        for filepath in glob.glob("**/AndroidManifest*.xml", recursive=True):
            with open(filepath, "r", encoding="utf-8") as f:
                content = f.read()
            if "package=" in content:
                new_content = re.sub(r'\s+package=["\'][^"\']*["\']', '', content)
                with open(filepath, "w", encoding="utf-8") as f:
                    f.write(new_content)

        # 2. Fix build.gradle files across modules
        for filepath in glob.glob("**/build.gradle", recursive=True):
            with open(filepath, "r", encoding="utf-8") as f:
                content = f.read()
            
            if "app/build.gradle" not in filepath and not filepath.endswith("app/build.gradle"):
                content = content.replace("com.android.application", "com.android.library")
                content = re.sub(r'applicationId(Suffix)?\s+[\'"][^\'"]*[\'"]', '', content)

            if "dynamicFeatures" in content:
                content = re.sub(r'dynamicFeatures\s*=\s*\[[^\]]*\]', '', content)

            with open(filepath, "w", encoding="utf-8") as f:
                f.write(content)

        # 3. Fix string formatting error in strings.xml
        for filepath in glob.glob("**/strings.xml", recursive=True):
            with open(filepath, "r", encoding="utf-8") as f:
                content = f.read()
            if 'name="multi_version_tips_content"' in content and 'formatted="false"' not in content:
                content = content.replace(
                    '<string name="multi_version_tips_content">',
                    '<string name="multi_version_tips_content" formatted="false">'
                )
                with open(filepath, "w", encoding="utf-8") as f:
                    f.write(content)
                print(f"Fixed string formatting in: {filepath}")

        # 4. Remove duplicate iconSize attribute definition causing resource collision
        for filepath in glob.glob("**/res/values/*.xml", recursive=True):
            with open(filepath, "r", encoding="utf-8") as f:
                content = f.read()
            if 'name="iconSize"' in content:
                content = re.sub(r'<attr\s+name=["\']iconSize["\'][^>]*/>', '', content)
                with open(filepath, "w", encoding="utf-8") as f:
                    f.write(content)
                print(f"Removed duplicate iconSize attr from: {filepath}")

        print("Successfully patched project configuration and resources automatically.")
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Search and Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-apks
        path: '**/*.apk'
        
