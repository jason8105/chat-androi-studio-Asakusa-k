name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Switch to required Gradle version (Gradle 8.11.1)
      run: |
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip" > gradle/wrapper/gradle-wrapper.properties

    - name: Automatically Patch Project Structure for AGP 8+
      run: |
        python3 - << 'EOF'
        import glob
        import re

        # 1. Clean Manifests (remove obsolete package attributes safely)
        for filepath in glob.glob("**/AndroidManifest*.xml", recursive=True):
            with open(filepath, "r", encoding="utf-8") as f:
                content = f.read()
            if "package=" in content:
                new_content = re.sub(r'\s+package=["\'][^"\']*["\']', '', content)
                with open(filepath, "w", encoding="utf-8") as f:
                    f.write(new_content)
                print(f"Cleaned manifest: {filepath}")

        # 2. Fix build.gradle files across modules
        for filepath in glob.glob("**/build.gradle", recursive=True):
            with open(filepath, "r", encoding="utf-8") as f:
                content = f.read()
            
            # Normalize submodules to library plugins
            if "app/build.gradle" not in filepath and not filepath.endswith("app/build.gradle"):
                content = content.replace("com.android.application", "com.android.library")
                content = re.sub(r'applicationId\s+[\'"][^\'"]*[\'"]', '', content)

            # Remove dynamicFeature conflicts safely
            if "dynamicFeatures" in content:
                content = re.sub(r'dynamicFeatures\s*=\s*\[[^\]]*\]', '', content)

            with open(filepath, "w", encoding="utf-8") as f:
                f.write(content)

        print("Successfully patched project configuration automatically.")
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Search and Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-apks
        path: '**/*.apk'
